name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run eval
      - run: npm run readiness:production-reference
      - run: npm run build
      - run: docker build -t adaptcloud-applied-ai-residency:${{ github.sha }} .
      - run: npm audit --omit=dev
