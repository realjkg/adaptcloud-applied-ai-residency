name: Infrastructure foundations

on:
  pull_request:
    paths:
      - "infra/**"
      - "observability/**"
      - ".github/workflows/infrastructure.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Cloud foundation to plan
        required: true
        type: choice
        options: [aws, gcp]
      image_digest:
        description: Immutable image reference (registry/repository@sha256:digest)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: infra-${{ github.workflow }}-${{ github.ref }}-${{ inputs.target || 'validate' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aws, gcp]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - name: Check formatting
        run: terraform -chdir=infra/${{ matrix.target }} fmt -check -recursive
      - name: Initialize without a state backend
        run: terraform -chdir=infra/${{ matrix.target }} init -backend=false -input=false
      - name: Validate configuration
        run: terraform -chdir=infra/${{ matrix.target }} validate

  plan-aws:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'aws'
    needs: validate
    runs-on: ubuntu-latest
    environment: infrastructure-plan
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - name: Exchange GitHub OIDC token for an AWS session
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: adaptcloud-plan-${{ github.run_id }}
      - name: Initialize
        run: |
          terraform -chdir=infra/aws init \
            -input=false \
            -backend-config="bucket=${{ vars.AWS_TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.AWS_TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Create reviewed plan only
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_image_digest: ${{ inputs.image_digest }}
          AWS_PRIVATE_SUBNET_IDS_JSON: ${{ vars.AWS_PRIVATE_SUBNET_IDS_JSON }}
          AWS_SERVICE_SECURITY_GROUP_IDS_JSON: ${{ vars.AWS_SERVICE_SECURITY_GROUP_IDS_JSON }}
          TF_VAR_otel_collector_image: ${{ vars.AWS_OTEL_COLLECTOR_IMAGE }}
        run: |
          terraform -chdir=infra/aws plan \
            -input=false \
            -lock-timeout=5m \
            -var="private_subnet_ids=${AWS_PRIVATE_SUBNET_IDS_JSON}" \
            -var="service_security_group_ids=${AWS_SERVICE_SECURITY_GROUP_IDS_JSON}" \
            -out=tfplan
      - name: Render human-readable plan
        run: terraform -chdir=infra/aws show -no-color tfplan > infra/aws/plan.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aws-terraform-plan-${{ github.run_id }}
          path: infra/aws/plan.txt
          retention-days: 7

  plan-gcp:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'gcp'
    needs: validate
    runs-on: ubuntu-latest
    environment: infrastructure-plan
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - name: Exchange GitHub OIDC token for a GCP session
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_PLAN_SERVICE_ACCOUNT }}
      - name: Initialize
        run: |
          terraform -chdir=infra/gcp init \
            -input=false \
            -backend-config="bucket=${{ vars.GCP_TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ vars.GCP_TF_STATE_PREFIX }}"
      - name: Create reviewed plan only
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_runtime_service_account: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          TF_VAR_invoker_member: ${{ vars.GCP_INVOKER_MEMBER }}
          TF_VAR_image_digest: ${{ inputs.image_digest }}
          TF_VAR_otel_collector_image: ${{ vars.GCP_OTEL_COLLECTOR_IMAGE }}
          TF_VAR_otel_config_secret: ${{ vars.GCP_OTEL_CONFIG_SECRET }}
        run: terraform -chdir=infra/gcp plan -input=false -lock-timeout=5m -out=tfplan
      - name: Render human-readable plan
        run: terraform -chdir=infra/gcp show -no-color tfplan > infra/gcp/plan.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gcp-terraform-plan-${{ github.run_id }}
          path: infra/gcp/plan.txt
          retention-days: 7
