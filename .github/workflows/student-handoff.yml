name: Student handoff

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clean-room:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install without inherited credentials
        run: env -u ANTHROPIC_API_KEY -u ANTHROPIC_MODEL -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u GOOGLE_APPLICATION_CREDENTIALS npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run eval
      - name: Run all six credential-free labs
        run: env -u ANTHROPIC_API_KEY -u ANTHROPIC_MODEL npm run lab:simulate
      - run: npm run readiness:production-reference
      - run: npm run build
      - name: Verify the lockfile remained reproducible
        run: git diff --exit-code -- package-lock.json

  container-and-telemetry:
    needs: clean-room
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build immutable candidate image
        run: docker build -t student-residency:${{ github.sha }} .
      - name: Test non-root container, HTTP boundaries, and shutdown
        env:
          IMAGE_TAG: student-residency:${{ github.sha }}
        run: npm run acceptance:container
      - name: Test real OTLP export and sensitive-data exclusion
        run: npm run acceptance:telemetry

  supply-chain:
    needs: clean-room
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build candidate image
        run: docker build -t student-residency:${{ github.sha }} .
      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          image: student-residency:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: student-residency-sbom.spdx.json
          upload-artifact-retention: 14
          upload-release-assets: false
      - name: Scan repository, secrets, and infrastructure configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan candidate container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: student-residency:${{ github.sha }}
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
